<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urja-Stambh — Smart Street Pole Control</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&display=swap');

  :root {
    --bg: #040d0f;
    --panel: #071318;
    --panel2: #091a21;
    --border: #0e3340;
    --accent: #00e5c0;
    --accent2: #f5a623;
    --accent3: #e84040;
    --dim: #3bf0c8;
    --text: #b4d8e0;
    --muted: #3a6472;
    --grid: #0c2830;
    --glow: 0 0 18px #00e5c088;
    --glow2: 0 0 18px #f5a62388;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    font-family: 'Rajdhani', sans-serif;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 39px, var(--grid) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, var(--grid) 40px);
  }

  /* ── Scanline overlay ── */
  body::after {
    content: '';
    pointer-events: none;
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 3px,
      rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px
    );
    z-index: 999;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(90deg, #040d0f 60%, #071f28);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo-icon {
    width: 36px; height: 52px;
    display: flex; flex-direction: column; align-items: center;
    gap: 2px;
  }

  .pole-head {
    width: 28px; height: 10px;
    background: var(--accent);
    border-radius: 3px 3px 0 0;
    box-shadow: var(--glow);
    position: relative;
  }

  .pole-head::after {
    content: '';
    position: absolute;
    top: 3px; left: 4px; right: 4px; bottom: 2px;
    background: #fff;
    border-radius: 2px;
    opacity: 0.85;
    animation: ledPulse 2s ease-in-out infinite;
  }

  @keyframes ledPulse {
    0%,100% { opacity: 0.85; }
    50% { opacity: 0.4; }
  }

  .pole-shaft {
    width: 6px;
    flex: 1;
    background: linear-gradient(180deg, var(--accent) 0%, #0e3340 100%);
    border-radius: 2px;
  }

  .logo h1 {
    font-family: 'Orbitron', monospace;
    font-size: 1.15rem;
    font-weight: 900;
    letter-spacing: 0.18em;
    color: var(--accent);
    text-shadow: var(--glow);
    line-height: 1.1;
  }

  .logo span {
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.25em;
    font-weight: 500;
    display: block;
  }

  .header-meta {
    display: flex; gap: 24px; align-items: center;
  }

  .status-chip {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.72rem;
    padding: 4px 12px;
    border: 1px solid var(--accent);
    border-radius: 2px;
    color: var(--accent);
    letter-spacing: 0.12em;
    background: #00e5c008;
  }

  .live-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
    margin-right: 6px;
    animation: blink 1.1s step-end infinite;
  }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  #clock {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.82rem;
    color: var(--muted);
    letter-spacing: 0.12em;
  }

  /* ── Main grid ── */
  .main {
    display: grid;
    grid-template-columns: 300px 1fr 260px;
    gap: 0;
    height: calc(100vh - 73px);
  }
  /* ── Panel base ── */
  .panel {
    border-right: 1px solid var(--border);
    padding: 20px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .panel:last-child { border-right: none; border-left: 1px solid var(--border); }

  .section-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.3em;
    color: var(--muted);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── Pole Cards ── */
  .pole-card {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 12px 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
    overflow: hidden;
  }

  .pole-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .pole-card.active, .pole-card:hover {
    border-color: var(--accent);
    background: #0a1e27;
  }

  .pole-card.active::before { opacity: 1; }

  .pole-card.alert { border-color: var(--accent3); }
  .pole-card.alert::before { background: var(--accent3); opacity: 1; }

  .pole-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .pole-id {
    font-family: 'Orbitron', monospace;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.12em;
  }

  .pole-card.alert .pole-id { color: var(--accent3); }

  .badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem;
    padding: 2px 8px;
    border-radius: 1px;
    letter-spacing: 0.1em;
  }
   .badge-green { background: #00e5c020; color: var(--accent); border: 1px solid #00e5c040; }
  .badge-yellow { background: #f5a62320; color: var(--accent2); border: 1px solid #f5a62340; }
  .badge-red { background: #e8404020; color: var(--accent3); border: 1px solid #e8404040; }

  .mini-bar-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 4px;
  }

  .mini-label {
    font-size: 0.62rem;
    color: var(--muted);
    width: 52px;
    letter-spacing: 0.06em;
  }

  .mini-bar-bg {
    flex: 1; height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .mini-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.8s cubic-bezier(.4,0,.2,1);
  }

  .fill-green { background: var(--accent); }
  .fill-yellow { background: var(--accent2); }
  .fill-red { background: var(--accent3); }

  .mini-val {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem;
    color: var(--text);
    width: 30px;
    text-align: right;
  }

  /* ── Center panel ── */
  .center-panel {
    padding: 20px 28px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ── Big Pole Visual ── */
  .pole-hero {
    display: flex;
    align-items: flex-start;
    gap: 28px;
  }
 /* ── Big Pole Visual ── */
  .pole-hero {
    display: flex;
    align-items: flex-start;
    gap: 28px;
  }

  .pole-visual-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    min-width: 100px;
  }

  .pole-lamp {
    width: 80px; height: 28px;
    border-radius: 4px 4px 0 0;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    transition: background 0.6s, box-shadow 0.6s;
  }

  .pole-lamp-inner {
    width: 68px; height: 14px;
    border-radius: 3px;
    background: rgba(255,255,255,0.85);
    transition: opacity 0.6s, box-shadow 0.6s;
  }

  .pole-body {
    width: 10px;
    height: 160px;
    background: linear-gradient(180deg, #1a3d50 0%, #0e2530 100%);
    border-radius: 2px;
  }

  .pole-base {
    width: 30px; height: 10px;
    background: #0e2530;
    border-radius: 0 0 3px 3px;
  }

  /* Light cone */
  .light-cone {
    position: absolute;
    top: 28px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 55px solid transparent;
    border-right: 55px solid transparent;
    pointer-events: none;
    transition: border-top-width 0.5s, opacity 0.6s;
    opacity: 0;
  }

  /* ── Gauges ── */
  .gauges-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .gauge-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 14px 12px;
    position: relative;
    overflow: hidden;
  }

  .gauge-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,229,192,0.04) 0%, transparent 60%);
    pointer-events: none;
  }

  .gauge-title {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.2em;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .gauge-val {
    font-family: 'Orbitron', monospace;
    font-size: 1.7rem;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 4px;
  }

  .gauge-unit {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.58rem;
    color: var(--muted);
    letter-spacing: 0.15em;
  }

  .gauge-bar-bg {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 10px;
    overflow: hidden;
  }

  .gauge-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 1s cubic-bezier(.4,0,.2,1);
  }
  /* ── Chart ── */
  .chart-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 16px;
    flex: 1;
  }

  canvas#trafficChart {
    width: 100% !important;
  }

  /* ── Controls ── */
  .control-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .ctrl-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    padding: 10px 8px;
    border-radius: 2px;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .ctrl-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: #00e5c010;
  }

  .ctrl-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: #00e5c015;
    box-shadow: var(--glow);
  }

  .ctrl-btn.danger { border-color: #e8404040; }
  .ctrl-btn.danger:hover { border-color: var(--accent3); color: var(--accent3); background: #e8404010; }

  /* ── Slider ── */
  .slider-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 16px;
  }

  .slider-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px;
  }

  .slider-title {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--muted);
  }

  .slider-val-display {
    font-family: 'Orbitron', monospace;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--accent);
    text-shadow: var(--glow);
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: var(--glow);
    cursor: pointer;
    transition: transform 0.15s;
  }

  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }

  /* ── Right panel: Log ── */
  .log-entry {
    display: flex;
    gap: 8px;
    margin-bottom: 9px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.62rem;
    line-height: 1.5;
    opacity: 0;
    animation: fadeIn 0.4s forwards;
  }

  @keyframes fadeIn { to { opacity: 1; } }

  .log-time { color: var(--muted); flex-shrink: 0; }
  .log-msg { color: var(--text); }
  .log-msg.warn { color: var(--accent2); }
  .log-msg.alert { color: var(--accent3); }
  .log-msg.ok { color: var(--accent); }

  /* ── Anomaly banner ── */
  .anomaly-banner {
    background: #e8404015;
    border: 1px solid var(--accent3);
    border-radius: 3px;
    padding: 12px 14px;
    margin-bottom: 14px;
    display: none;
    animation: alertPulse 1s ease-in-out infinite alternate;
  }

  @keyframes alertPulse {
    from { border-color: #e84040; }
    to { border-color: #e8404070; }
  }

  .anomaly-title {
    font-family: 'Orbitron', monospace;
    font-size: 0.72rem;
    color: var(--accent3);
    letter-spacing: 0.12em;
    margin-bottom: 4px;
  }

  .anomaly-desc {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem;
    color: #e84040bb;
    letter-spacing: 0.08em;
  }

  /* ── Ambient toggle ── */
  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 10px;
  }
